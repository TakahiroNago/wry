name: verify macos bounds
on:
  push:
    branches: [verify/macos-bounds]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sw_vers && rustc --version
      - run: cargo build
        working-directory: verify
      - run: perl -e 'alarm 90; exec @ARGV' ./target/debug/verify
        working-directory: verify
